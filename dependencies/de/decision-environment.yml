---
# Decision Environment for EDA rulebook activations.
#
# Includes servicenow.itsm (for the records source plugin that polls SNOW)
# and ansible.eda (for filters like json_filter and normalize_keys).
#
# Build with:
#   ansible-builder build -f dependencies/de/decision-environment.yml -t your-registry/snow-de:latest
#
# Push with:
#   podman push your-registry/snow-de:latest

version: 3

dependencies:
  galaxy:
    collections:
      - name: servicenow.itsm
      - name: ansible.eda
  system:
    - pkgconf-pkg-config [platform:rpm]
    - systemd-devel [platform:rpm]
    - gcc [platform:rpm]
    - python3.11-devel [platform:rpm]

options:
  package_manager_path: /usr/bin/microdnf

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/de-minimal-rhel9:latest
