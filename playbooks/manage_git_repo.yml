---
# GitHub repository operations via the GitHub API.
# Handles file commits and pull request creation via the `action` variable.
#
# Actions:
#   commit_file — Commit a file to a GitHub repo (create or update).
#                 Publishes commit_sha and file_url via set_stats.
#   create_pr   — Create a pull request from a branch.
#                 Publishes pr_number and pr_url via set_stats.
#
# GITHUB_TOKEN is injected as an env var by the "GitHub API Token" credential type.
#
# Usage from AO workflow extra_vars:
#   { "action": "commit_file", "file_path": "playbooks/fix.yml", "file_content": "...", "commit_message": "Add fix" }
#   { "action": "commit_file", "file_path": "playbooks/fix.yml", "file_content": "...", "branch": "feature/fix" }
#   { "action": "create_pr", "pr_title": "Add fix playbook", "head_branch": "feature/fix" }

- name: Manage GitHub Repository
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    github_api: "https://api.github.com"
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('YOUR_ORG/YOUR_REPO', true) }}"
    branch: "main"
    base_branch: "main"

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - action is defined
          - action in ['commit_file', 'create_pr']
        fail_msg: "action must be one of: commit_file, create_pr"

    - name: Validate GitHub token
      ansible.builtin.assert:
        that:
          - github_token | length > 0
        fail_msg: "GITHUB_TOKEN must be set (injected by GitHub API Token credential)"

    # =========================================================================
    # ACTION: commit_file
    # Commits a single file to a GitHub repo via the Contents API.
    # If the file already exists, it updates it (requires the existing SHA).
    # If a branch is specified, creates the branch first if it doesn't exist.
    # =========================================================================
    - name: Validate commit_file parameters
      ansible.builtin.assert:
        that:
          - file_path is defined
          - file_content is defined
          - commit_message is defined
        fail_msg: "file_path, file_content, and commit_message must be provided for commit_file"
      when: action == 'commit_file'

    # --- Create branch if needed ---
    - name: Get base branch ref
      ansible.builtin.uri:
        url: "{{ github_api }}/repos/{{ github_repo }}/git/ref/heads/{{ base_branch }}"
        method: GET
        headers:
          Authorization: "token {{ github_token }}"
          Accept: "application/vnd.github.v3+json"
        return_content: true
      register: base_ref
      when:
        - action == 'commit_file'
        - branch != base_branch

    - name: Create branch if it doesn't exist
      ansible.builtin.uri:
        url: "{{ github_api }}/repos/{{ github_repo }}/git/refs"
        method: POST
        headers:
          Authorization: "token {{ github_token }}"
          Accept: "application/vnd.github.v3+json"
        body_format: json
        body:
          ref: "refs/heads/{{ branch }}"
          sha: "{{ base_ref.json.object.sha }}"
        status_code: [201, 422]
      when:
        - action == 'commit_file'
        - branch != base_branch

    # --- Check if file already exists (need SHA for updates) ---
    - name: Check if file exists
      ansible.builtin.uri:
        url: "{{ github_api }}/repos/{{ github_repo }}/contents/{{ file_path }}?ref={{ branch }}"
        method: GET
        headers:
          Authorization: "token {{ github_token }}"
          Accept: "application/vnd.github.v3+json"
        return_content: true
        status_code: [200, 404]
      register: existing_file
      when: action == 'commit_file'

    # --- Commit the file ---
    - name: Commit file to GitHub
      ansible.builtin.uri:
        url: "{{ github_api }}/repos/{{ github_repo }}/contents/{{ file_path }}"
        method: PUT
        headers:
          Authorization: "token {{ github_token }}"
          Accept: "application/vnd.github.v3+json"
        body_format: json
        body:
          message: "{{ commit_message }}"
          content: "{{ file_content | b64encode }}"
          branch: "{{ branch }}"
          sha: "{{ existing_file.json.sha | default(omit) }}"
        return_content: true
        status_code: [200, 201]
      register: commit_result
      when: action == 'commit_file'

    - name: Display commit result
      ansible.builtin.debug:
        msg: |
          === File Committed ===
          Repo: {{ github_repo }}
          Path: {{ file_path }}
          Branch: {{ branch }}
          SHA: {{ commit_result.json.commit.sha }}
          URL: {{ commit_result.json.content.html_url }}
      when: action == 'commit_file'

    - name: Publish commit artifacts
      ansible.builtin.set_stats:
        data:
          commit_sha: "{{ commit_result.json.commit.sha }}"
          file_url: "{{ commit_result.json.content.html_url }}"
        aggregate: false
      when: action == 'commit_file'

    # =========================================================================
    # ACTION: create_pr
    # Creates a pull request on GitHub.
    # =========================================================================
    - name: Validate create_pr parameters
      ansible.builtin.assert:
        that:
          - pr_title is defined
          - head_branch is defined
        fail_msg: "pr_title and head_branch must be provided for create_pr"
      when: action == 'create_pr'

    - name: Create pull request
      ansible.builtin.uri:
        url: "{{ github_api }}/repos/{{ github_repo }}/pulls"
        method: POST
        headers:
          Authorization: "token {{ github_token }}"
          Accept: "application/vnd.github.v3+json"
        body_format: json
        body:
          title: "{{ pr_title }}"
          body: "{{ pr_body | default('Automated PR created by AO workflow.') }}"
          head: "{{ head_branch }}"
          base: "{{ base_branch }}"
        return_content: true
        status_code: [201]
      register: pr_result
      when: action == 'create_pr'

    - name: Display PR result
      ansible.builtin.debug:
        msg: |
          === Pull Request Created ===
          Repo: {{ github_repo }}
          PR #{{ pr_result.json.number }}: {{ pr_result.json.title }}
          URL: {{ pr_result.json.html_url }}
          Head: {{ head_branch }} → Base: {{ base_branch }}
      when: action == 'create_pr'

    - name: Publish PR artifacts
      ansible.builtin.set_stats:
        data:
          pr_number: "{{ pr_result.json.number }}"
          pr_url: "{{ pr_result.json.html_url }}"
        aggregate: false
      when: action == 'create_pr'
