---
# Dual-rule EDA rulebook for AO projects.
#
# Rule 1: Poll ServiceNow incidents and trigger an AO workflow.
# Rule 2: Poll ServiceNow change requests and bridge CR approval to AO.
#
# Requires a Decision Environment with servicenow.itsm for the
# servicenow.itsm.records source plugin. See dependencies/de/decision-environment.yml.
#
# Customize:
#   - sysparm_query filters for your incident/CR naming patterns
#   - Job template names to match your CaC vars.yml
#   - event_payload fields to match your AO workflow trigger schema

# ─── Rule 1: ServiceNow Incident Polling ─────────────────────────────────────
- name: Monitor incidents in ServiceNow
  hosts: all
  execution_strategy: parallel
  sources:
    - servicenow.itsm.records:
        table: incident
        interval: 10
        remote_servicenow_timezone: "Europe/London"
        # Newest first to avoid the "oldest page first" trap
        sysparm_query: >
          ORDERBYDESCsys_updated_on^ORDERBYDESCsys_id
      filters:
        - ansible.eda.json_filter:
        - ansible.eda.normalize_keys:
  rules:
    - name: Trigger AO workflow for new incidents
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - sys_id
      condition: event.short_description is defined
      action:
        run_job_template:
          name: AO Workflow Bridge
          organization: Default
          post_events: true
          job_args:
            extra_vars:
              webhook_path: "{{ webhook_path }}"
              event_payload:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                incident_description: "{{ event.short_description + ' ' + event.description }}"
                incident_urgency: "{{ event.urgency }}"
                incident_impact: "{{ event.impact }}"

# ─── Rule 2: ServiceNow CR Approval Bridge ───────────────────────────────────
- name: ServiceNow CR Approval Bridge
  hosts: all
  sources:
    - servicenow.itsm.records:
        table: change_request
        interval: 10
        remote_servicenow_timezone: "Europe/London"
        # Filter to your CR naming pattern — customize the LIKE clause
        sysparm_query: >
          ORDERBYDESCsys_updated_on^ORDERBYDESCsys_id
      filters:
        - ansible.eda.json_filter:
        - ansible.eda.normalize_keys:
  rules:
    - name: CR moved to Implement — bridge approval to AO
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - sys_id
      # state == '-1' is the Implement state in ServiceNow
      condition: event.state == '-1'
      action:
        run_job_template:
          name: Bridge AO Approval
          organization: Default
          job_args:
            extra_vars:
              cr_number: "{{ event.number }}"
              cr_sys_id: "{{ event.sys_id }}"
              cr_short_description: "{{ event.short_description }}"
