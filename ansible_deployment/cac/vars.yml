---
# =============================================================================
# AAP Configuration as Code — AO Baseline Template
# =============================================================================
# This file defines all AAP Controller + EDA objects needed for an AO project.
# Customize names, descriptions, and project references for your use case.

# -----------------------------------------------------------------------------
# Custom Credential Types
# -----------------------------------------------------------------------------
controller_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for ITSM API"
    kind: cloud
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

  - name: "AO Webhook Credential"
    description: "OAuth2 service account for Automation Orchestrator EDA trigger"
    kind: cloud
    inputs:
      fields:
        - id: webhook_base_url
          type: string
          label: "AO Base URL"
        - id: webhook_client_id
          type: string
          label: "Service Account Client ID"
        - id: webhook_client_secret
          type: string
          label: "Service Account Client Secret"
          secret: true
    injectors:
      extra_vars:
        webhook_base_url: !unsafe "{{ webhook_base_url }}"
        webhook_client_id: !unsafe "{{ webhook_client_id }}"
        webhook_client_secret: !unsafe "{{ webhook_client_secret }}"

  - name: "GitHub API Token"
    description: "Personal access token for GitHub API operations (commits, PRs)"
    kind: cloud
    inputs:
      fields:
        - id: github_token
          type: string
          label: "GitHub Token"
          secret: true
    injectors:
      env:
        GITHUB_TOKEN: !unsafe "{{ github_token }}"

  - name: "AO API Credential"
    description: "Service account for Automation Orchestrator REST API (approval bridge)"
    kind: cloud
    inputs:
      fields:
        - id: ao_sa_client_id
          type: string
          label: "AO Service Account Client ID"
        - id: ao_sa_client_secret
          type: string
          label: "AO Service Account Client Secret"
          secret: true
        - id: ao_base_url
          type: string
          label: "AO API Base URL"
          help_text: "Internal or external URL for the AO API (e.g. https://ao.example.com)"
    injectors:
      extra_vars:
        ao_sa_client_id: !unsafe "{{ ao_sa_client_id }}"
        ao_sa_client_secret: !unsafe "{{ ao_sa_client_secret }}"
        ao_base_url: !unsafe "{{ ao_base_url }}"

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "ServiceNow ITSM"
    description: "ServiceNow instance for incident and change request management"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow operations"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "AO Webhook"
    description: "OAuth2 credentials for AO EDA trigger endpoint"
    organization: "Default"
    credential_type: "AO Webhook Credential"
    inputs:
      webhook_base_url: "{{ ao_webhook_base_url }}"
      webhook_client_id: "{{ ao_webhook_client_id }}"
      webhook_client_secret: "{{ ao_webhook_client_secret }}"

  - name: "AO API"
    description: "Service account for AO approval bridge"
    organization: "Default"
    credential_type: "AO API Credential"
    inputs:
      ao_sa_client_id: "{{ ao_sa_client_id }}"
      ao_sa_client_secret: "{{ ao_sa_client_secret }}"
      ao_base_url: "{{ ao_base_url }}"

  - name: "GitHub API"
    description: "GitHub PAT for committing files and raising PRs"
    organization: "Default"
    credential_type: "GitHub API Token"
    inputs:
      github_token: "{{ github_token }}"

  - name: "Demo SSH"
    description: "SSH key for EC2 demo host (generated by Terraform)"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ demo_ssh_key }}"

# -----------------------------------------------------------------------------
# Inventories
# -----------------------------------------------------------------------------
controller_inventories:
  - name: "Demo Inventory"
    description: "Default inventory for AO workflow job templates"
    organization: "Default"

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "AO Baseline"
    description: "Playbooks and rulebooks for AO workflow automation"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

# -----------------------------------------------------------------------------
# Job Templates
# -----------------------------------------------------------------------------
controller_templates:
  - name: "AO Workflow Bridge"
    description: >-
      EDA-to-AO bridge: obtains OAuth2 token from Automation Orchestrator
      and POSTs the event payload to the AO EDA trigger endpoint.
    organization: "Default"
    job_type: "run"
    project: "AO Baseline"
    playbook: "playbooks/trigger_ao_workflow.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "AO Webhook"

  - name: "Manage SNOW Incident"
    description: >-
      All ServiceNow incident operations: create, update, resolve.
      Pass action=create|update|resolve in extra_vars.
    organization: "Default"
    job_type: "run"
    project: "AO Baseline"
    playbook: "playbooks/manage_snow_incident.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow ITSM"

  - name: "Manage SNOW Change Request"
    description: >-
      All ServiceNow CR operations: create, authorize, update, review, close.
      Pass action=create|authorize|update|review|close in extra_vars.
    organization: "Default"
    job_type: "run"
    project: "AO Baseline"
    playbook: "playbooks/manage_snow_change_request.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow ITSM"

  - name: "Bridge AO Approval"
    description: >-
      Bridges ServiceNow CR approval to AO. Authenticates with AO API,
      finds pending approval by CR number, approves via PATCH.
    organization: "Default"
    job_type: "run"
    project: "AO Baseline"
    playbook: "playbooks/bridge_ao_approval.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "AO API"

  - name: "Manage Git Repo"
    description: >-
      GitHub operations: commit files, create pull requests.
      Pass action=commit_file|create_pr in extra_vars.
    organization: "Default"
    job_type: "run"
    project: "AO Baseline"
    playbook: "playbooks/manage_git_repo.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "GitHub API"

# =============================================================================
# Event-Driven Ansible
# =============================================================================

# -----------------------------------------------------------------------------
# EDA Credential Types
# -----------------------------------------------------------------------------
eda_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for EDA source plugins"
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

# -----------------------------------------------------------------------------
# EDA Decision Environments
# -----------------------------------------------------------------------------
eda_decision_environments:
  - name: "ServiceNow DE"
    description: "Decision environment with servicenow.itsm for SNOW polling"
    organization: "Default"
    image_url: "{{ de_image }}"

# -----------------------------------------------------------------------------
# EDA Projects
# -----------------------------------------------------------------------------
eda_projects:
  - name: "AO Baseline"
    description: "EDA rulebooks for ServiceNow event monitoring and AO bridging"
    organization: "Default"
    url: "{{ git_repo_url }}"
    wait: true

# -----------------------------------------------------------------------------
# EDA Credentials
# -----------------------------------------------------------------------------
eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch job templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: false

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for the EDA records source plugin"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

# -----------------------------------------------------------------------------
# EDA Event Streams (for receiving external webhooks)
# -----------------------------------------------------------------------------
# Uncomment and configure if your use case receives external webhooks
# (e.g. Splunk alerts, GitHub webhooks, monitoring tool alerts).
# Requires a Token Event Stream credential (see eda_credentials above).
#
# eda_event_streams:
#   - name: "External Webhook Events"
#     organization: "Default"
#     credential_name: "Webhook Events Token"
#     event_stream_type: token
#     forward_events: true          # CRITICAL: defaults to false (disabled)!
#     test_mode: false

# -----------------------------------------------------------------------------
# Rulebook Activations
# -----------------------------------------------------------------------------
# PATTERN: If your use case has both webhook AND polling sources, you need
# TWO separate activations — event streams override the rulebook source,
# so a SNOW polling rulebook can't share an activation with a webhook listener.
#
# Activation 1 (webhook): Uses source_mappings to connect to an event stream
# Activation 2 (polling): Uses servicenow.itsm.records directly, NO event stream
#
# Example webhook activation:
# - name: "webhook-listener"
#   project: "Your Project"
#   rulebook: "webhook_listener.yml"
#   decision_environment: "ServiceNow DE"
#   enabled: true
#   extra_vars:
#     webhook_path: "{{ ao_webhook_path }}"
#   source_mappings:
#     - source_name: my_webhook_source    # must match 'name:' in the rulebook source
#       event_stream_name: "External Webhook Events"
#   eda_credentials:
#     - "AAP Controller Token"

eda_rulebook_activations:
  - name: "ao-baseline-events"
    description: "Monitor ServiceNow incidents and CR approvals for AO workflows"
    organization: "Default"
    project: "AO Baseline"
    rulebook: "example_eda_rulebook.yml"
    decision_environment: "ServiceNow DE"
    enabled: true
    extra_vars:
      webhook_path: "{{ ao_webhook_path }}"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
